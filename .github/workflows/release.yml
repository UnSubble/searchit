name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Upload Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests
        run: go test ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Build binaries
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify binary version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          BIN_VERSION="$(./dist/searchit --version)"
          echo "Git tag:        ${TAG}"
          echo "Binary version: ${BIN_VERSION}"
          if ! echo "${BIN_VERSION}" | grep -Fq "${TAG}"; then
            echo "ERROR: Binary version '${BIN_VERSION}' does not contain tag '${TAG}'."
            echo "Ensure internal/version/version.go was updated before tagging."
            exit 1
          fi
          echo "✓ Binary version matches tag."

      - name: Upload artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
           name: searchit-binaries
           path: dist/*
