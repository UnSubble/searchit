schema: 1

name: scan/maniac
tool: scan

description: Maximum-discovery profile optimized for aggressive scanning. May generate significant load on the target.

author: searchit
license: MIT
homepage: https://github.com/unsubble/searchit

tags:
  - aggressive
  - maniac
  - recursive

depends:
  - scan/base

experimental: false

config:
  threads: 128
  timeout: 5
  connect-timeout: 2

  recursive: true
  adaptive: true
  follow-redirects: true

  max-depth: 5
  strategy: bfs

  random-agent: true
